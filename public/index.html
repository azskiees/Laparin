<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laparin - Pesan Makanan Food Court</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #667085; --line: #e4e7ec;
      --brand: #e8590c; --brand-d: #c74a08; --ok: #2f9e44; --warn: #e67700; --bad: #e03131; --info: #1c7ed6;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14161a; --card: #1d2026; --text: #eceef2; --muted: #9aa3b2; --line: #2c313a; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    header { background: var(--brand); color: #fff; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    header h1 { margin: 0; font-size: 1.3rem; }
    #health { font-size: .85rem; background: rgba(255,255,255,.2); padding: 4px 10px; border-radius: 999px; }
    nav { display: flex; gap: 8px; padding: 12px 20px 0; max-width: 1100px; margin: 0 auto; }
    nav button { border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 8px 16px; border-radius: 8px 8px 0 0; cursor: pointer; font-size: .95rem; }
    nav button.active { background: var(--brand); color: #fff; border-color: var(--brand); }
    main { max-width: 1100px; margin: 0 auto; padding: 16px 20px 40px; }
    .layout { display: grid; grid-template-columns: 1fr 320px; gap: 16px; align-items: start; }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .chip { border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 7px 14px; border-radius: 999px; cursor: pointer; }
    .chip.active { background: var(--text); color: var(--bg); }
    .menus { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
    .menu h3 { margin: 0 0 4px; font-size: 1rem; }
    .price { font-weight: 600; color: var(--brand); }
    .muted { color: var(--muted); font-size: .85rem; }
    button.primary { background: var(--brand); color: #fff; border: 0; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: .9rem; }
    button.primary:hover { background: var(--brand-d); }
    button.primary:disabled { opacity: .5; cursor: not-allowed; }
    button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); padding: 6px 10px; border-radius: 8px; cursor: pointer; }
    input[type=text], select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font-size: .95rem; }
    label { display: block; font-size: .85rem; margin: 0 0 4px; color: var(--muted); }
    .cart-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
    .stepper { display: flex; align-items: center; gap: 6px; }
    .stepper button { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
    .total { display: flex; justify-content: space-between; font-weight: 700; margin: 12px 0; }
    .sticky { position: sticky; top: 12px; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .78rem; font-weight: 600; color: #fff; }
    .st-PENDING { background: var(--warn); } .st-DIPROSES { background: var(--info); }
    .st-SIAP { background: #7048e8; } .st-SELESAI { background: var(--ok); } .st-DIBATALKAN { background: var(--bad); }
    .order { margin-bottom: 12px; }
    .order .head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 14px; align-items: end; }
    .toolbar > div { flex: 1; }
    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 10px 18px; border-radius: 8px; color: #fff; display: none; z-index: 10; max-width: 90vw; }
    #toast.ok { background: var(--ok); } #toast.err { background: var(--bad); }
    ul.items { margin: 6px 0 0; padding-left: 18px; font-size: .88rem; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>Laparin</h1>
    <span id="health">memeriksa server...</span>
  </header>

  <nav>
    <button id="tab-shop" class="active">Pesan Makanan</button>
    <button id="tab-orders">Kelola Pesanan</button>
  </nav>

  <main>
    <!-- ===== Halaman pemesanan ===== -->
    <section id="view-shop">
      <div class="layout">
        <div>
          <p class="muted" style="margin-top:0">1. Pilih tenant &nbsp; 2. Tambah menu ke keranjang &nbsp; 3. Isi nama dan checkout</p>
          <div id="shop-tenants" class="chips"></div>
          <div id="menus" class="menus"></div>
        </div>
        <aside class="card sticky">
          <h2 style="margin-top:0;font-size:1.1rem">Keranjang</h2>
          <div style="margin-bottom:10px">
            <label for="customer">Nama pemesan</label>
            <input id="customer" type="text" maxlength="100" placeholder="Contoh: Budi">
          </div>
          <div id="cart"></div>
          <div class="total"><span>Perkiraan total</span><span id="cart-total">Rp0</span></div>
          <button id="btn-checkout" class="primary" style="width:100%" disabled>Checkout</button>
          <p class="muted" style="margin-bottom:0">Total akhir dihitung ulang oleh server.</p>
          <div id="receipt" class="hidden" style="margin-top:12px"></div>
        </aside>
      </div>
    </section>

    <!-- ===== Halaman kelola pesanan ===== -->
    <section id="view-orders" class="hidden">
      <div class="toolbar">
        <div>
          <label for="order-tenant">Tenant</label>
          <select id="order-tenant"></select>
        </div>
        <button id="btn-refresh" class="ghost">Muat ulang</button>
      </div>
      <div id="orders"></div>
    </section>
  </main>

  <div id="toast"></div>

  <script>
    const NEXT = { PENDING: ['DIPROSES', 'DIBATALKAN'], DIPROSES: ['SIAP'], SIAP: ['SELESAI'], SELESAI: [], DIBATALKAN: [] };
    const rupiah = (n) => 'Rp' + Number(n).toLocaleString('id-ID');
    const $ = (sel) => document.querySelector(sel);

    // Membuat elemen DOM dengan aman (teks lewat textContent, bukan innerHTML)
    function h(tag, props = {}, ...children) {
      const el = document.createElement(tag);
      for (const [k, v] of Object.entries(props)) {
        if (v === null || v === undefined || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v);
      }
      for (const c of children.flat()) {
        if (c === null || c === undefined) continue;
        el.append(c.nodeType ? c : document.createTextNode(String(c)));
      }
      return el;
    }

    async function api(path, method = 'GET', body) {
      const res = await fetch(path, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: body === undefined ? undefined : JSON.stringify(body),
      });
      if (res.status === 204) return null;
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Permintaan gagal');
      return data;
    }

    let toastTimer;
    function toast(msg, type = 'ok') {
      const t = $('#toast');
      t.textContent = msg;
      t.className = type;
      t.style.display = 'block';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { t.style.display = 'none'; }, 3500);
    }

    // ---------- State ----------
    let tenants = [];
    let shopTenantId = null;
    let menus = [];
    const cart = new Map(); // menu_id -> { menu, qty }

    // ---------- Health ----------
    async function loadHealth() {
      try {
        const d = await api('/health');
        $('#health').textContent = 'Server: ' + d.status + ' | Database: ' + d.database;
      } catch (e) {
        $('#health').textContent = 'Server bermasalah';
      }
    }

    // ---------- Halaman pemesanan ----------
    function renderTenantChips() {
      const box = $('#shop-tenants');
      box.replaceChildren(...tenants.map((t) =>
        h('button', { class: 'chip' + (t.id === shopTenantId ? ' active' : ''), onclick: () => selectShopTenant(t.id) }, t.name)));
    }

    async function selectShopTenant(id) {
      if (id !== shopTenantId && cart.size > 0) {
        if (!confirm('Mengganti tenant akan mengosongkan keranjang. Lanjutkan?')) return;
        cart.clear();
      }
      shopTenantId = id;
      renderTenantChips();
      await loadMenus();
      renderCart();
    }

    async function loadMenus() {
      menus = await api('/tenants/' + shopTenantId + '/menus');
      renderMenus();
    }

    function renderMenus() {
      const box = $('#menus');
      if (menus.length === 0) {
        box.replaceChildren(h('p', { class: 'muted' }, 'Belum ada menu untuk tenant ini.'));
        return;
      }
      box.replaceChildren(...menus.map((m) => {
        const inCart = cart.get(m.id) ? cart.get(m.id).qty : 0;
        const habis = m.daily_stock <= 0;
        return h('div', { class: 'card menu' },
          h('h3', {}, m.name),
          h('div', { class: 'price' }, rupiah(m.price)),
          h('div', { class: 'muted', style: 'margin:4px 0 10px' }, habis ? 'Stok habis' : 'Stok: ' + m.daily_stock),
          h('button', { class: 'primary', disabled: habis || inCart >= m.daily_stock ? 'disabled' : null, onclick: () => addToCart(m) },
            inCart >= m.daily_stock && !habis ? 'Maksimal' : '+ Tambah'));
      }));
    }

    function addToCart(menu) {
      const cur = cart.get(menu.id);
      const qty = cur ? cur.qty : 0;
      if (qty >= menu.daily_stock) return toast('Stok ' + menu.name + ' tidak cukup', 'err');
      cart.set(menu.id, { menu, qty: qty + 1 });
      renderMenus();
      renderCart();
    }

    function changeQty(menuId, delta) {
      const item = cart.get(menuId);
      if (!item) return;
      const q = item.qty + delta;
      if (q <= 0) cart.delete(menuId);
      else if (q > item.menu.daily_stock) return toast('Stok tidak cukup', 'err');
      else item.qty = q;
      renderMenus();
      renderCart();
    }

    function renderCart() {
      const box = $('#cart');
      if (cart.size === 0) {
        box.replaceChildren(h('p', { class: 'muted' }, 'Keranjang masih kosong.'));
      } else {
        box.replaceChildren(...[...cart.values()].map(({ menu, qty }) =>
          h('div', { class: 'cart-row' },
            h('div', {}, h('div', {}, menu.name), h('div', { class: 'muted' }, rupiah(menu.price) + ' x ' + qty)),
            h('div', { class: 'stepper' },
              h('button', { onclick: () => changeQty(menu.id, -1), 'aria-label': 'Kurangi' }, '-'),
              h('span', {}, qty),
              h('button', { onclick: () => changeQty(menu.id, 1), 'aria-label': 'Tambah' }, '+')))));
      }
      let total = 0;
      cart.forEach(({ menu, qty }) => { total += menu.price * qty; });
      $('#cart-total').textContent = rupiah(total);
      $('#btn-checkout').disabled = cart.size === 0;
    }

    async function checkout() {
      const name = $('#customer').value.trim();
      if (!name) return toast('Isi nama pemesan dulu', 'err');
      const btn = $('#btn-checkout');
      btn.disabled = true;
      try {
        // Buat keranjang di server, isi item, lalu checkout
        const c = await api('/carts', 'POST', { tenant_id: shopTenantId });
        for (const { menu, qty } of cart.values()) {
          await api('/carts/' + c.id + '/items', 'POST', { menu_id: menu.id, qty });
        }
        const lines = [...cart.values()].map(({ menu, qty }) => ({ name: menu.name, price: menu.price, qty }));
        const order = await api('/carts/' + c.id + '/checkout', 'POST', { customer_name: name });
        showReceipt(order, lines);
        cart.clear();
        toast('Pesanan #' + order.id + ' berhasil dibuat');
        await loadMenus();
      } catch (e) {
        toast(e.message, 'err');
      } finally {
        renderCart();
      }
    }

    function showReceipt(order, lines) {
      const r = $('#receipt');
      r.className = 'card';
      r.replaceChildren(
        h('strong', {}, 'Pesanan #' + order.id),
        ' ',
        h('span', { class: 'badge st-' + order.status }, order.status),
        h('ul', { class: 'items' }, lines.map((i) => h('li', {}, i.name + ' x ' + i.qty + ' = ' + rupiah(i.price * i.qty)))),
        h('div', { class: 'total', style: 'margin-bottom:0' }, h('span', {}, 'Total (server)'), h('span', {}, rupiah(order.total))));
    }

    // ---------- Halaman kelola pesanan ----------
    async function loadOrders() {
      const id = $('#order-tenant').value;
      const box = $('#orders');
      if (!id) { box.replaceChildren(); return; }
      try {
        const orders = await api('/tenants/' + id + '/orders');
        if (orders.length === 0) {
          box.replaceChildren(h('p', { class: 'muted' }, 'Belum ada pesanan untuk tenant ini.'));
          return;
        }
        box.replaceChildren(...orders.map(renderOrder));
      } catch (e) {
        toast(e.message, 'err');
      }
    }

    function renderOrder(o) {
      const detail = h('ul', { class: 'items hidden' });
      const actions = h('div', { class: 'actions' },
        h('button', { class: 'ghost', onclick: () => toggleDetail(o.id, detail) }, 'Detail'),
        NEXT[o.status].map((next) =>
          h('button', { class: next === 'DIBATALKAN' ? 'ghost' : 'primary', onclick: () => setStatus(o.id, next) }, '-> ' + next)));
      return h('div', { class: 'card order' },
        h('div', { class: 'head' },
          h('strong', {}, '#' + o.id + ' - ' + o.customer_name),
          h('span', { class: 'badge st-' + o.status }, o.status)),
        h('div', { class: 'muted' }, 'Total ' + rupiah(o.total)),
        detail,
        actions);
    }

    async function toggleDetail(orderId, ul) {
      if (!ul.classList.contains('hidden')) { ul.classList.add('hidden'); return; }
      try {
        const o = await api('/orders/' + orderId);
        ul.replaceChildren(...o.items.map((i) => h('li', {}, i.name + ' x ' + i.qty + ' = ' + rupiah(i.price * i.qty))));
        ul.classList.remove('hidden');
      } catch (e) {
        toast(e.message, 'err');
      }
    }

    async function setStatus(orderId, status) {
      try {
        await api('/orders/' + orderId + '/status', 'PATCH', { status });
        toast('Status pesanan #' + orderId + ' menjadi ' + status);
      } catch (e) {
        toast(e.message, 'err');
      }
      loadOrders();
    }

    // ---------- Tab ----------
    function showTab(which) {
      $('#view-shop').classList.toggle('hidden', which !== 'shop');
      $('#view-orders').classList.toggle('hidden', which !== 'orders');
      $('#tab-shop').classList.toggle('active', which === 'shop');
      $('#tab-orders').classList.toggle('active', which === 'orders');
      if (which === 'orders') loadOrders();
      else if (shopTenantId) loadMenus();
    }

    // ---------- Mulai ----------
    async function init() {
      $('#tab-shop').addEventListener('click', () => showTab('shop'));
      $('#tab-orders').addEventListener('click', () => showTab('orders'));
      $('#btn-checkout').addEventListener('click', checkout);
      $('#btn-refresh').addEventListener('click', loadOrders);
      $('#order-tenant').addEventListener('change', loadOrders);
      loadHealth();
      try {
        tenants = await api('/tenants');
        $('#order-tenant').replaceChildren(...tenants.map((t) => h('option', { value: t.id }, t.name)));
        renderCart();
        if (tenants.length) await selectShopTenant(tenants[0].id);
        else $('#menus').replaceChildren(h('p', { class: 'muted' }, 'Belum ada tenant.'));
      } catch (e) {
        toast(e.message, 'err');
      }
    }
    init();
  </script>
</body>
</html>
